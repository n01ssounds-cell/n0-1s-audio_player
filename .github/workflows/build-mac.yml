name: Compilar para macOS
on:
  workflow_dispatch:
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac dmg zip
      - uses: actions/upload-artifact@v4
        with:
          name: N0-1S-Audio-Player-Mac
          path: |
            dist/*.dmg
            dist/*.zip
